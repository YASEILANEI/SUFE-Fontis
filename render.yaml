services:
  - type: web
    name: sufe-fontis
    runtime: python
    plan: free
    healthCheckPath: /api/meta
    buildCommand: cd backend && pip install -r requirements.txt && python -m ingest.parse && python -m ingest.chunk && python -m ingest.embed_store
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: deepseek-chat
